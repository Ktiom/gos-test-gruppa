<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фельдшер — Тест сұрақтары (1-нұсқа)</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f8f9fa;
            --text: #2c3e50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            color: var(--text);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1, h3 {
            text-align: center;
            color: var(--text);
        }
        /* Панель навигации */
        .nav-panel {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 25px;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        @media (max-width: 600px) {
            .nav-panel { grid-template-columns: repeat(5, 1fr); }
        }
        .nav-btn {
            padding: 8px 0;
            border: 1px solid #dee2e6;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #6c757d;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #e2e6ea; }
        .nav-btn.active {
            border: 2px solid var(--primary);
            color: var(--primary);
            transform: scale(1.1);
        }
        .nav-btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .nav-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }
        
        /* Карточка вопроса */
        .question-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            min-height: 350px;
        }
        .question-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg);
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 15px;
            background: var(--bg);
            border: 1px solid #dee2e6;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05em;
        }
        .option:hover:not(.disabled) {
            background: #e2e6ea;
            border-color: #adb5bd;
        }
        .option.disabled { cursor: default; }
        .option.correct { background: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold; }
        .option.incorrect { background: #f8d7da; border-color: #f5c6cb; color: #721c24; font-weight: bold; }
        
        /* Кнопки управления */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .ctrl-btn {
            padding: 12px 25px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: opacity 0.2s;
        }
        .ctrl-btn:hover { opacity: 0.8; }
        .ctrl-btn:disabled { background: #6c757d; cursor: not-allowed; opacity: 0.5; }

        /* Итог */
        .stats {
            text-align: center;
            margin-top: 15px;
            font-size: 1.1em;
            font-weight: bold;
            color: var(--text);
        }
    </style>
</head>

        let questions = [];

        rawText.split('\n').forEach(line => {
            line = line.trim();
            if (!line) return;

            if (/^\d+\./.test(line)) {
                // Новый вопрос. Удаляем номер и точку в начале
                let text = line.replace(/^\d+\.\s*/, '');
                currentQuestion = {
                    originalText: text,
                    options: [],
                    answered: false,
                    correctOptionId: null,
                    userSelectedId: null
                };
                questions.push(currentQuestion);
            } else if (currentQuestion) {
                let isCorrect = line.endsWith('+');
                let optText = isCorrect ? line.slice(0, -1).trim() : line;
                
                // Создаем уникальный ID для варианта (чтобы отследить после перемешивания)
                let optObj = {
                    id: currentQuestion.options.length,
                    text: optText,
                    isCorrect: isCorrect
                };
                
                if (isCorrect) currentQuestion.correctOptionId = optObj.id;
                currentQuestion.options.push(optObj);
            }
        });

        // Функция тасования массива (Алгоритм Фишера-Йетса)
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Перемешиваем сами вопросы и варианты ответов внутри них
        shuffle(questions);
        questions.forEach(q => shuffle(q.options));

        // Глобальные переменные состояния

        // Инициализация навигационной панели

            questions.forEach((_, i) => {

                btn.textContent = i + 1;
                btn.onclick = () => goToQuestion(i);
                navPanel.appendChild(btn);
            });
        }

        // Отображение конкретного вопроса
        function renderQuestion(index) {
            currentIndex = index;
            const q = questions[index];
            
            // Обновляем панель навигации (выделение текущего)
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-btn-${index}`).classList.add('active');

            // Обновляем текст вопроса
            qTitle.textContent = `${index + 1}. ${q.originalText}`;

            // Очищаем и создаем варианты ответа
            optsContainer.innerHTML = '';
            
            q.options.forEach((opt, optIndex) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                optDiv.id = `opt-${index}-${opt.id}`;
                // Добавляем нумерацию 1, 2, 3, 4, 5
                optDiv.textContent = `${optIndex + 1}. ${opt.text}`;
                
                // Если вопрос уже был отвечен, применяем стили и отключаем клик
                if (q.answered) {
                    optDiv.classList.add('disabled');
                    if (opt.isCorrect) {
                        optDiv.classList.add('correct');
                    } else if (q.userSelectedId === opt.id) {
                        optDiv.classList.add('incorrect');
                    }
                } else {
                    optDiv.onclick = () => selectOption(index, opt);
                }
                
                optsContainer.appendChild(optDiv);
            });

            // Управление кнопками Вперед/Назад
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === questions.length - 1;
        }

        // Выбор варианта ответа
        function selectOption(qIndex, selectedOpt) {
            const q = questions[qIndex];
            if (q.answered) return; // Защита от повторного клика

            q.answered = true;
            q.userSelectedId = selectedOpt.id;

            const navBtn = document.getElementById(`nav-btn-${qIndex}`);

            // Проверка правильности
            if (selectedOpt.isCorrect) {
                correctAnswersCount++;
                navBtn.classList.add('correct');
                document.getElementById(`opt-${qIndex}-${selectedOpt.id}`).classList.add('correct');
            } else {
                navBtn.classList.add('incorrect');
                document.getElementById(`opt-${qIndex}-${selectedOpt.id}`).classList.add('incorrect');
                // Сразу подсвечиваем правильный вариант
                document.getElementById(`opt-${qIndex}-${q.correctOptionId}`).classList.add('correct');
            }

            // Отключаем все опции для текущего вопроса
            Array.from(optsContainer.children).forEach(child => child.classList.add('disabled'));

            // Обновляем статистику
            updateStats();
        }

        function updateStats() {
            const answeredCount = questions.filter(q => q.answered).length;
            stats.textContent = `Жауап берілді: ${answeredCount} / 100 | Дұрыс жауаптар: ${correctAnswersCount}`;
        }

        function goToQuestion(index) {
            renderQuestion(index);
        }

        function prevQuestion() {
            if (currentIndex > 0) renderQuestion(currentIndex - 1);
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) renderQuestion(currentIndex + 1);
        }

        // Запуск
        initNav();
        renderQuestion(0);
        updateStats();

    </script>
</body>
</html>
